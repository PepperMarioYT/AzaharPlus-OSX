name: azaharplus-macos-build

# Trigger manually or on push/tag
on:
  workflow_dispatch:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    env:
      OS: macos
      TARGET: ${{ matrix.arch }}
    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2️⃣ Cache ccache
      - name: Set up ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-

      # 3️⃣ Install dependencies
      - name: Install Homebrew dependencies
        run: ./scripts/osxdep

      # 4️⃣ Configure project
      - name: Configure build
        run: ./scripts/osxconf

      # 5️⃣ Build
      - name: Build
        run: ./scripts/osxbuild

      # 6️⃣ Package into DMG
      - name: Package DMG
        run: ./scripts/osxpack ${{ github.run_number }}

      # 7️⃣ Upload DMG artifact
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: azaharplus-${{ matrix.arch }}-macos
          path: azaharplus-*/AzaharPlus-*.dmg

  macos-universal:
    runs-on: macos-latest
    needs: macos
    if: matrix.arch == 'x86_64' || matrix.arch == 'arm64'
    env:
      OS: macos
      TARGET: universal
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1️⃣ Download cached builds from previous jobs
      - name: Restore x86_64 DMG
        uses: actions/download-artifact@v4
        with:
          name: azaharplus-x86_64-macos
          path: x86_64

      - name: Restore arm64 DMG
        uses: actions/download-artifact@v4
        with:
          name: azaharplus-arm64-macos
          path: arm64

      # 2️⃣ Merge into universal binary
      - name: Create universal .app
        run: ./scripts/macos-universal.sh
        env:
          ARTIFACTS: x86_64 arm64

      # 3️⃣ Package universal DMG
      - name: Package universal DMG
        run: ./scripts/osxpack ${{ github.run_number }}-universal

      # 4️⃣ Upload universal DMG
      - name: Upload universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: azaharplus-universal-macos
          path: azaharplus-*/AzaharPlus-*.dmg
